name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
  SERVICE_NAME: ${{ secrets.GCP_SERVICE_NAME || 'classic-touch-painting-site' }}
  IMAGE_NAME: gcr.io/${{ secrets.GCP_PROJECT_ID }}/classic-touch-painting-site

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Google Container Registry
        run: gcloud auth configure-docker --quiet

      - name: Build and push container image
        run: |
          docker build -t "$IMAGE_NAME:${GITHUB_SHA::12}" .
          docker push "$IMAGE_NAME:${GITHUB_SHA::12}"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --image "$IMAGE_NAME:${GITHUB_SHA::12}" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "SMTP_USER=$_SMTP_USER,SMTP_PASS=$_SMTP_PASS,STAGING_ENABLED=true,STAGING_PASSWORD=$_STAGING_PASSWORD,STAGING_SESSION_SECRET=$_STAGING_SESSION_SECRET"

